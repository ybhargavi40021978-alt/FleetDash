services:
  mongodb:
    image: mongo:7
    container_name: fleetdash-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - fleetdash_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: fleetdash-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fleetdash_redis_data:/data

volumes:
  fleetdash_mongo_data:
  fleetdash_redis_data:
